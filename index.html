    box-sizing:border-box;

body{

}

.card{

    border-radius:20px;
    padding:20px;

}

    color:#D4AF37;
    margin:0 0 15px 0;
    font-size:clamp(20px, 5vw, 30px);

}

#timer{
    color:#D4AF37;
    font-size:clamp(28px, 8vw, 48px);
    font-weight:bold;
    margin-bottom:12px;
    text-shadow:0 0 10px rgba(212,175,55,0.4);
    line-height:1.2;
}

#nextDate{
    color:#D4AF37;
    font-size:clamp(14px, 3.5vw, 18px);
    opacity:0.9;
    line-height:1.4;
}
